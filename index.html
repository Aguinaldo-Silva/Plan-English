<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-/yOfGL42I2UczqxheI7qmcITlla8Nl0c5iGeGTdKJc0=' https://cdn.jsdelivr.net; connect-src https://*.supabase.co wss://*.supabase.co; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guia diário de inglês</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#F7F9FC; --ink:#141B2D; --muted:#5D6A85; --line:#DEE3EC;
  --primary:#2457D6; --primary-ink:#FFFFFF; --primary-soft:#E7EEFF;
  --done:#168A5A; --done-ink:#0E5C3C; --done-soft:#DCF3E8; --half:#9ED5BD;
  --danger:#C2410C; --danger-soft:#FEE9DF;
  --navy:#101A33; --navy-2:#1B2B55;
  --sea:var(--primary); --sea-soft:var(--primary-soft); --sun:var(--done); --sun-soft:var(--done-soft); --sun-ink:var(--done-ink); --focus:var(--primary);
  --shadow:0 1px 2px rgba(20,27,45,.06),0 8px 24px -12px rgba(20,27,45,.18);
  --r:14px;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --display:"Sora","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0F1420;--surface:#171E2E;--surface-2:#1D2638;--ink:#E7EBF3;--muted:#9AA5BC;--line:#2A3448;--primary:#7A9EFF;--primary-ink:#0F1420;--primary-soft:#1E2B4D;--done:#3DCB8A;--done-ink:#BDEFD6;--done-soft:#153826;--half:#2A6B4E;--danger:#F59E7E;--danger-soft:#3A2218;--navy:#0B1226;--navy-2:#16214A;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0F1420;--surface:#171E2E;--surface-2:#1D2638;--ink:#E7EBF3;--muted:#9AA5BC;--line:#2A3448;--primary:#7A9EFF;--primary-ink:#0F1420;--primary-soft:#1E2B4D;--done:#3DCB8A;--done-ink:#BDEFD6;--done-soft:#153826;--half:#2A6B4E;--danger:#F59E7E;--danger-soft:#3A2218;--navy:#0B1226;--navy-2:#16214A;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
a{color:var(--primary)}
.hidden{display:none!important}
#app{min-height:100%;display:flex;flex-direction:column}
#app>.wrap{width:100%}

/* ---------- app bar ---------- */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.appbar .in{max-width:1040px;margin:0 auto;padding:0 18px;height:60px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--primary);display:grid;place-items:center;color:var(--primary-ink);font-style:normal;font-size:15px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14.5px;color:var(--muted)}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
.user{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.user b{max-width:160px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom;font-weight:600;color:var(--ink)}
.user button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;font-weight:600}
@media (max-width:760px){
  .appbar .in{height:56px;flex-wrap:wrap;padding:0 12px}
  .user b{display:none}
  .tabs{order:3;width:100%;margin:0;padding:0 0 6px}
  .appbar .in{height:auto;padding-top:8px}
}

/* ---------- layout ---------- */
.wrap{max-width:1040px;margin:0 auto;padding:24px 18px 72px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(22px,3.6vw,30px);line-height:1.1;letter-spacing:-.02em;margin:0 0 4px}
.lead{margin:0;color:var(--muted);font-size:14.5px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 10px}
@media (max-width:560px){.stats{grid-template-columns:1fr 1fr;gap:8px}}
.st{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0;box-shadow:var(--shadow)}
.st b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(22px,4vw,28px);line-height:1;letter-spacing:-.02em}
.st span{display:block;font-size:12.5px;color:var(--muted);margin-top:5px}
.goalbar{margin:8px 0 0}
.goalbar .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:5px}
.goalbar .lbl b{color:var(--ink)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:4px;transition:width .5s ease}
.bar i.sun{background:var(--done)}
.sync{font-size:12.5px;color:var(--muted);margin:10px 0 0;display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok::before{background:var(--done)}
.sync.bad::before{background:var(--danger)}

/* ---------- day panel ---------- */
.dayhead{margin:22px 0 2px;font-family:var(--display);font-size:clamp(22px,3.4vw,28px);font-weight:800;line-height:1.1;letter-spacing:-.02em}
.dayctx{color:var(--muted);font-size:14px;margin:0 0 14px}
.dayctx b{color:var(--ink)}
.epi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 14px 18px;margin:0 0 14px;position:relative;box-shadow:var(--shadow)}
.epi::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 3px 3px 0;background:var(--primary)}
.epi h4{margin:0 0 4px;font-family:var(--display);font-size:16px}
.epi p{margin:0;font-size:14.5px}
.epi p+p{margin-top:6px;color:var(--muted)}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.pill{border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.pill.on{background:var(--done-soft);border-color:transparent;color:var(--done-ink)}
.grp{margin:0 0 18px}
.grp h3{font-family:var(--display);font-size:16px;margin:0 0 8px;display:flex;align-items:baseline;gap:10px}
.grp h3 small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:13px}
.task{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.task:hover{border-color:var(--primary)}
.task.done{background:var(--done-soft);border-color:transparent}
.task input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--done);cursor:pointer}
.task .tt{display:block;font-weight:600;line-height:1.35}
.task .td{display:block;font-size:14px;color:var(--muted);margin-top:3px}
.task.done .td{color:var(--done-ink)}
.task .ta{display:block;font-size:12.5px;margin-top:6px;color:var(--primary);font-weight:600}
.task .tm{text-align:right;font-family:var(--display);font-weight:800;font-size:17px;line-height:1;white-space:nowrap}
.task .tm small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted);margin-top:4px}
.ankibox{background:var(--primary-soft);border-radius:var(--r);padding:12px 16px;margin:0 0 16px}
.ankibox h4{margin:0 0 4px;font-family:var(--display);font-size:15px}
.ankibox ul{margin:4px 0 0;padding-left:18px;font-size:14.5px}
.note{font-size:13.5px;color:var(--muted)}
.btn{border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;border:1px solid var(--primary);background:var(--primary);color:var(--primary-ink)}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.sm{padding:7px 12px;font-size:14px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.6;cursor:default}
.banner{border:1px solid var(--line);border-left:4px solid var(--primary)}

/* ---------- calendar ---------- */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.calhead h2{font-family:var(--display);font-size:20px;margin:0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{text-align:center;font-size:12px;color:var(--muted);padding-bottom:4px}
.cell{height:72px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 7px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;text-align:left;min-width:0;position:relative}
.cell:hover{border-color:var(--primary)}
.cell.out{opacity:.35;cursor:default}
.cell.wk{background:var(--surface-2)}
.cell.today{border-color:var(--primary);box-shadow:inset 0 0 0 1.5px var(--primary)}
.cell.sel{outline:3px solid var(--done);outline-offset:-3px}
.cell .n{font-family:var(--display);font-weight:700;font-size:14px;line-height:1}
.cell .lb{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .d{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:transparent}
.cell.min .d{background:var(--half)}
.cell.full .d{background:var(--done)}
.cell.test .lb{color:var(--primary);font-weight:700}
@media (max-width:560px){.cell{height:56px;padding:4px 5px}.cell .n{font-size:13px}.cell .lb{font-size:9.5px}}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin:10px 0 20px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}

/* ---------- metas ---------- */
.meta{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.meta.cur{border-color:var(--primary)}
.meta h3{font-family:var(--display);font-size:19px;margin:0 0 2px}
.meta .ms{color:var(--muted);font-size:13.5px;margin:0 0 10px}
.meta ul{margin:10px 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.meta li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.meta li input{width:18px;height:18px;margin-top:3px;accent-color:var(--done)}
.quiz{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}
.q{margin:0 0 14px}
.q p{margin:0 0 6px;font-weight:600}
.q label{display:block;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;cursor:pointer;font-size:14.5px}
.q label.ok{border-color:var(--done);background:var(--done-soft)}
.q label.bad{border-color:var(--danger);background:var(--danger-soft)}
.q .ex{font-size:13.5px;color:var(--muted);margin-top:4px}
.prompt{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;white-space:pre-wrap}

/* ---------- generic ---------- */
h2.sec{font-family:var(--display);font-size:21px;margin:26px 0 10px;letter-spacing:-.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
.card p{margin:0 0 8px}
.card ol,.card ul{margin:6px 0 0;padding-left:20px}
.card li{margin-bottom:6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);font-size:13px}
.tablewrap{overflow-x:auto}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);resize:vertical}
input[type=date],input[type=number],input[type=text],input[type=url],input[type=email],input[type=password]{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);width:100%;max-width:100%}
input[type=number]{width:110px}
input[type=date]{width:auto}
select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row > input[type=text],.row > input[type=url],.row > input[type=email],.row > input[type=password]{flex:1 1 200px;width:auto}
.kbd{font-family:var(--display);font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:13px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--primary)}
.lbl2{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.lbl2 .note{font-weight:400}
.msg{font-size:13.5px;color:var(--muted);min-height:1.2em}
.msg.err{color:var(--danger)}
footer{margin-top:40px;color:var(--muted);font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- auth screens ---------- */
.auth{flex:1;display:grid;grid-template-columns:1.05fr 1fr}
@media (max-width:820px){.auth{grid-template-columns:1fr}}
.auth .side{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:clamp(28px,6vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.auth .side .brand{color:#fff;font-size:18px}
.auth .side .brand i{background:#fff;color:var(--navy)}
.auth .side h2{font-family:var(--display);font-weight:800;font-size:clamp(28px,4.2vw,44px);line-height:1.05;letter-spacing:-.025em;margin:0 0 14px}
.auth .side p{margin:0;color:rgba(255,255,255,.78);max-width:46ch;font-size:15.5px}
.auth .side ul{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:10px}
.auth .side li{display:flex;gap:10px;align-items:flex-start;color:rgba(255,255,255,.9);font-size:14.5px}
.auth .side li::before{content:"";width:8px;height:8px;border-radius:50%;background:#7A9EFF;flex:none;margin-top:7px}
.auth .side small{color:rgba(255,255,255,.55);font-size:12.5px}
@media (max-width:820px){.auth .side{padding:28px 22px 24px}.auth .side ul{display:none}}
.auth .pane{display:flex;align-items:center;justify-content:center;padding:clamp(20px,5vw,56px) 18px}
.authcard{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 24px;box-shadow:var(--shadow)}
.authcard h3{font-family:var(--display);font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
.authcard .sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.authcard .lbl2{margin-top:12px}
.authcard .btn{margin-top:16px}
.authcard .links{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:14px}
.authcard .links button{background:none;border:0;padding:0;color:var(--primary);cursor:pointer;font-weight:600}
.segs{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;margin:0 0 6px}
.segs button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.segs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- Preset: Stranger Things (cenas sugeridas) ---------- */
const PRESETS = {
 "stranger things": {serie:"Stranger Things", seasons:[8,9,8,9,8], titles:{
  "1-1":["The Vanishing of Will Byers","O jogo de D&D no porão do Mike, nos primeiros minutos: quatro amigos discutindo uma jogada.","Vozes de crianças, frases curtas e muita emoção. Ótimo para shadowing.","início (logo depois da cena do laboratório)"],
  "1-2":["The Weirdo on Maple Street","Os meninos conhecendo a Eleven no porão e tentando se comunicar com ela.","Frases simples, repetidas e lentas, porque eles falam devagar para ela entender.","primeiro terço (a manhã seguinte, no porão)"],
  "1-3":["Holly, Jolly","Mike explicando a escola e os amigos para a Eleven.","Explicações claras com vocabulário do dia a dia.","meio"],
  "1-4":["The Body","Os meninos usando o rádio da escola com o Sr. Clarke.","Pedidos educados e perguntas, úteis para a vida real.","meio"],
  "1-5":["The Flea and the Acrobat","O Sr. Clarke explicando o Mundo Invertido com a pulga e o acrobata.","Um professor explicando devagar: a cena mais clara da temporada.","meio (na sala de aula)"],
  "1-6":["The Monster","Nancy e Jonathan comprando equipamento na loja de artigos militares.","Diálogo de compra: preço, pedir produtos, decidir junto.","início"],
  "1-7":["The Bathtub","Hopper e Joyce negociando com o Dr. Brenner no laboratório.","Adultos falando com calma e firmeza; vocabulário de negociação.","meio"],
  "1-8":["The Upside Down","Mike convidando a Eleven para o baile de inverno, na sala de aula.","Convite, planos e futuro com will.","final"],
  "2-1":["MADMAX","O jantar do Hopper e da Eleven na cabana, com as regras da casa.","Regras com must e can't, num diálogo lento entre duas pessoas.","meio"],
  "2-2":["Trick or Treat, Freak","Hopper e Eleven conversando sobre o Halloween na cabana.","Negociação em família com vocabulário de rotina.","início"],
  "2-3":["The Pollywog","Dustin apresentando o Dart para os amigos na escola.","Descrição de um animal e discussão entre amigos.","primeiro terço"],
  "2-4":["Will the Wise","A briga entre Hopper e Eleven na cabana.","Passado simples e emoção forte: ótimo para treinar entonação.","final"],
  "2-5":["Dig Dug","Bob descobrindo que os desenhos do Will formam um mapa, na cozinha.","Raciocínio em voz alta, frases curtas e claras.","meio"],
  "2-6":["The Spy","Steve e Dustin caminhando nos trilhos do trem e falando de garotas e cabelo.","Conversa descontraída entre dois amigos: o inglês mais natural da série.","meio"],
  "2-7":["The Lost Sister","Eleven conhecendo a Kali e o grupo dela em Chicago.","Sotaques e ritmo diferentes dos de Hawkins.","início"],
  "2-8":["The Mind Flayer","O grupo planejando o próximo passo na casa dos Byers.","Muitas vozes, planos e discordância: treino de escuta em grupo.","meio"],
  "2-9":["The Gate","Hopper e Eleven no carro, antes do portal.","Pedido de desculpas e conversa íntima, com passado e presente perfeito.","início"],
  "3-1":["Suzie, Do You Copy?","Steve e Robin no balcão da Scoops Ahoy com o quadro de pontos.","Humor e ironia; frases curtas e muito usadas.","início"],
  "3-2":["The Mall Rats","Hopper ensaiando a conversa séria com Mike, com ajuda da Joyce.","Um adulto ensaiando um discurso: repetição natural.","início"],
  "3-3":["The Case of the Missing Lifeguard","Dustin, Steve e Robin decifrando a mensagem em russo.","Vocabulário de raciocínio e dedução.","início"],

/* ---------- Monta o programa a partir da configuração ---------- */
function episodeList(cfg){
  const key = cfg.serie.trim().toLowerCase(), preset = PRESETS[key];
  const pasted = (cfg.titlesText || "").split("\n").map(x => x.trim()).filter(Boolean);
  const eps = []; let gi = 0;
  cfg.seasons.forEach((cnt, si) => { for (let e = 1; e <= cnt; e++){
    const s = si + 1, pk = `${s}-${e}`, pr = preset && preset.titles[pk], gen = GENERIC_SCENES[gi % GENERIC_SCENES.length];
    eps.push({s, e, title: pasted[gi] || (pr && pr[0]) || `Episódio ${e}`, scene: (pr && pr[1]) || gen[0], why: (pr && pr[2]) || gen[1], pos: (pr && pr[3]) || gen[2]});
    gi++; } });
  return eps;
}
function buildWeeks(cfg){
  const W = [], multi = cfg.seasons.length > 1;
  const label = ep => (multi ? `T${ep.s}E${ep.e}` : `E${ep.e}`);
  let chunks = [];
  if (cfg.serieOn){
    const E = episodeList(cfg);
    if (cfg.seasons.length >= 4){ const bySeason = s => E.filter(x => x.s === s); chunks = [bySeason(1), bySeason(2), bySeason(3), E.filter(x => x.s >= 4)]; }
    else { const n = Math.ceil(E.length / 4); chunks = [0,1,2,3].map(i => E.slice(i * n, (i + 1) * n)); }
    chunks = chunks.map(c => c.length ? c : null);
    const epw = cfg.epw === 2 ? 2 : 1;
    const push = (meta, group) => { for (let i = 0; i < group.length; i += epw){ const eps = group.slice(i, i + epw); W.push({meta, type:"ep", eps, label: eps.map(label).join(" + "), title: eps.map(x => x.title).join(" / "), scene: eps[0].scene, why: eps[0].why, pos: eps[0].pos, sub: multi ? `Temporada ${eps[0].s}` : "Episódios"}); } };
    const rew = (meta, list, extra) => W.push({meta, type:"rewatch", eps:list, label: list.map(label).join(", "), title:`Rever sem legenda: ${list.map(label).join(", ")}${extra ? " + " + extra : ""}`});
    for (let m = 0; m < 4; m++){
      if (chunks[m]) push(m + 1, chunks[m]);
      if (m === 2 && E.length){ const base = E.slice(0, 8), half = Math.ceil(base.length / 2); rew(3, base.slice(0, half)); rew(3, base.slice(half).length ? base.slice(half) : base.slice(0, half)); }
      if (m === 3 && E.length){ for (let i = 0; i < 4; i++){ const a = E[(2 * i) % E.length], b = E[(2 * i + 1) % E.length]; rew(4, a === b ? [a] : [a, b], "conversa real"); } }
    }
  } else {
    const sizes = [8, 9, 8, 9];
    sizes.forEach((n, m) => { for (let i = 0; i < n; i++) W.push({meta: m + 1, type:"video", label:`Vídeo ${i + 1}`, title:`Um vídeo de 15 a 25 min do seu barril`, scene: GENERIC_SCENES[i % GENERIC_SCENES.length][0], why: GENERIC_SCENES[i % GENERIC_SCENES.length][1], pos: GENERIC_SCENES[i % GENERIC_SCENES.length][2]}); if (m === 2) for (let j = 0; j < 2; j++) W.push({meta:3, type:"video", label:"Revisão", title:"Rever 3 vídeos já estudados sem legenda"}); if (m === 3) for (let j = 0; j < 4; j++) W.push({meta:4, type:"video", label:"Revisão", title:"Rever vídeos já estudados sem legenda + conversa real"}); });
  }
  W.forEach((w, i) => { w.n = i + 1; w.theme = THEMES[i % THEMES.length]; });
  return W;
}
function metaPart(cfg, chunkIdx, weeks){
  const ws = weeks.filter(w => w.meta === chunkIdx + 1 && w.type !== "rewatch");
  if (!cfg.serieOn) return "os vídeos desta meta";
  if (!ws.length) return "esta parte";
  const subs = [...new Set(ws.map(w => w.sub))];
  return subs.length === 1 && subs[0] !== "Episódios" ? `a ${subs[0]}` : `os episódios ${ws[0].label} a ${ws[ws.length - 1].label}`;
}

  <h2 class="sec">Escada da legenda</h2><div class="card"><ol><li><b>Meta 1:</b> dupla, inglês em cima e português embaixo (Language Reactor).</li><li><b>Meta 2:</b> só inglês; português só ao passar o mouse.</li><li><b>Meta 3:</b> inglês no material novo; nenhuma no já visto.</li><li><b>Meta 4:</b> inglês no novo; os primeiros episódios inteiros sem legenda.</li></ol><p class="note">Regra de ouro: entendeu menos da metade? Volte um degrau por uma semana. É ajuste, não regressão.</p></div>
  <h2 class="sec">Como escolher a cena da semana</h2><div class="card"><ul><li>2 a 3 minutos, dois ou três personagens, pouca música e nenhuma ação alta.</li><li>De preferência uma cena que você gostou: emoção ajuda a memória.</li><li>O calendário sugere o tipo de cena a cada semana; para Stranger Things, sugere a cena exata.</li><li>A mesma cena serve a semana inteira: terça (escuta e shadowing), quarta (mineração), sexta (responder aos personagens).</li></ul></div>
  <h2 class="sec">Trocar de série ou de curso</h2><div class="card"><ul><li>Troque em Ajustes a qualquer momento: o calendário recalcula a partir da data de início, mas os dias já marcados continuam contando nas horas e na sequência.</li><li>A hora certa de trocar é no fim de uma meta, depois do teste. No meio de uma meta, só se a série ficou chata: tédio custa mais que uma troca.</li><li>Série nova de nível parecido? Continue na mesma meta. Série bem mais difícil? Volte um degrau na legenda por uma semana.</li><li>Sem série? Desligue a série em Ajustes e o guia passa a usar vídeos de 15 a 25 min do seu barril, com o mesmo ciclo semanal.</li></ul></div>
  <h2 class="sec">Técnicas, passo a passo</h2><div class="card"><p><b>Escuta intensiva:</b> 1x sem legenda, 1x com legenda em inglês, marcando o que você não ouviu. Procure reduções: gonna, wanna, gotta, kinda, whatcha, lemme.</p><p><b>Shadowing:</b> frase por frase, pausando, imitando ritmo, entonação e emoção. Depois 2 passadas contínuas, meio segundo atrás da voz original. Grave e compare.</p><p><b>Chorusing:</b> uma frase de 3 a 8 segundos em loop; fale junto 20 vezes até sua voz sumir dentro da original.</p><p><b>Sentence mining:</b> salve frases com exatamente uma coisa nova. 5 a 8 por semana bastam.</p><p><b>Responder aos personagens:</b> pause depois de cada fala e responda como se estivesse na cena. Toda vez que travar, anote a lacuna.</p><p><b>Roleplay por voz:</b> cole este prompt no modo de voz da IA e troque o cenário pelo do dia:</p>
  <div class="prompt" id="prRp">You are role-playing with me for English practice. I'm a Brazilian learner at A2/B1 level. Scenario: [cenário do dia]. Play the other person, speak naturally but not too fast, and stay in character. After about 10 exchanges, stop and give me: 3 mistakes I made with corrections, 3 more natural phrases I could have used, and one thing I did well.</div><div class="row" style="margin-top:8px"><button class="btn ghost sm" type="button" data-copy="prRp">Copiar prompt</button></div></div>
  <h2 class="sec">Ritmo e constância</h2><div class="card"><ul><li><b>Horário fixo, gatilho fixo:</b> os 40 min ativos sempre no mesmo lugar do dia.</li><li><b>Nunca zere o dia:</b> num dia ruim, só o Anki e uma escuta da cena. Marque o que fez.</li><li><b>Nunca falhe dois dias seguidos.</b></li><li><b>Fim de semana é leve de propósito:</b> 25 a 35 minutos já contam como dia feito.</li><li><b>Regra do próximo episódio:</b> só assista o próximo depois de estudar uma cena do atual.</li><li><b>Ficou uma semana parado?</b> Volte pelo dia mínimo, sem tentar compensar tudo de uma vez.</li></ul></div>`;
}
function viewAjustes(){
  const c = state.cfg, W = WEEKS();
  return `<h2 class="sec" style="margin-top:0">O que você está estudando agora</h2>
  <div class="card"><div class="row" style="margin-bottom:10px"><button class="btn ghost sm" type="button" id="presetST">Usar Stranger Things (5 temporadas)</button></div>
   <label class="toggle"><input type="checkbox" id="serieOn" ${c.serieOn ? "checked" : ""}> Estudar com uma série</label>
   <div id="serieFields" style="${c.serieOn ? "" : "display:none"}">
   <p style="margin:12px 0 4px"><b>Nome da série</b></p><input type="text" id="serieIn" value="${esc(c.serie)}" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)">
   <p style="margin:12px 0 4px"><b>Episódios por temporada</b> <span class="note">(separe por vírgula: 8, 9, 8)</span></p><input type="text" id="seasonsIn" value="${c.seasons.join(", ")}" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)">
   <p style="margin:12px 0 4px"><b>Episódios por semana</b></p><select id="epwIn" style="border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)"><option value="1" ${c.epw !== 2 ? "selected" : ""}>1 (episódios de 40 a 70 min)</option><option value="2" ${c.epw === 2 ? "selected" : ""}>2 (episódios curtos, de 20 a 30 min)</option></select>
   <p style="margin:12px 0 4px"><b>Títulos dos episódios</b> <span class="note">(opcional; um por linha, na ordem)</span></p><textarea id="titlesIn" placeholder="Pilot&#10;Diversity Day&#10;...">${esc(c.titlesText || "")}</textarea>
   </div></div>
  <div class="card"><label class="toggle"><input type="checkbox" id="cursoOn" ${c.cursoOn ? "checked" : ""}> Estudar com um curso</label>
   <div id="cursoFields" style="${c.cursoOn ? "" : "display:none"}"><p style="margin:12px 0 4px"><b>Nome do curso</b></p><input type="text" id="cursoIn" value="${esc(c.curso)}" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)">
   <p style="margin:12px 0 4px"><b>Quantas aulas?</b> <span class="note">Entram às segundas e quintas, duas por semana. Depois da última, viram revisão.</span></p><input type="number" id="aulasIn" min="1" max="400" value="${c.aulas}"></div></div>
  <div class="card"><p><b>Seu barril</b> <span class="note">(podcasts, canais e vídeos para os tempos mortos; um por linha. Eles rodam nas tarefas passivas.)</span></p><textarea id="barrilIn">${esc(c.barril.join("\n"))}</textarea></div>
  <div class="card"><p><b>Início do programa</b> <span class="note">(sempre uma segunda-feira; outras datas são ajustadas para a segunda da mesma semana)</span></p><div class="row"><input type="date" id="startIn" value="${state.start}"><button class="btn ghost sm" type="button" id="startNow">Recomeçar na segunda desta semana</button></div>
   <p class="note" style="margin-top:8px">Hoje você está na semana ${stats().curIdx + 1} de ${W.length}. Os dias já marcados continuam contando nas horas e na sequência.</p></div>
  <div class="row" style="margin:6px 0 20px"><button class="btn" type="button" id="cfgSave">Salvar e recalcular o calendário</button><span class="note" id="cfgNote"></span></div>
  <h2 class="sec">Conta e sincronização</h2>
  ${supaCard()}
  <h2 class="sec">Backup e sua própria cópia</h2>
  <div class="card"><p><b>Como o salvamento funciona:</b> dentro do claude.ai, o progresso fica na sua conta e aparece em qualquer aparelho. Numa cópia hospedada por você, fica no navegador de cada aparelho. Para levar o progresso de um lugar para outro, exporte aqui e importe lá.</p>
  <div class="row" style="margin:8px 0"><button class="btn sm" type="button" id="expBtn">Exportar progresso</button><button class="btn ghost sm" type="button" id="impBtn">Importar o texto abaixo</button><span class="note" id="ioNote"></span></div>
  <textarea id="ioBox" placeholder="O texto exportado aparece aqui. Para importar, cole o texto de outro aparelho e clique em Importar."></textarea></div>
  <div class="card"><p><b>Zerar progresso</b></p><button class="btn ghost sm" type="button" id="resetAll">Desmarcar todos os dias e testes</button></div>`;
}
let toastT = null;
function toast(msg){ let el = $("#toast"); if (!el){ el = document.createElement("div"); el.id = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); } el.textContent = msg; el.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 1800); }
function render(){
  const sc = screen(), app = $("#app");
  if (sc !== "app"){ app.innerHTML = authHTML(sc); return; }
  app.innerHTML = shellHTML();
  $("#view").innerHTML = view === "hoje" ? viewHoje() : view === "calendario" ? viewCalendario() : view === "metas" ? viewMetas() : view === "anki" ? viewAnki() : view === "metodo" ? viewMetodo() : viewAjustes();
}
function go(v, push){ view = v; if (push && location.hash !== "#" + v) location.hash = v; render(); window.scrollTo({top: 0}); }
function supaSaveCfgFromForm(){ const url = ($("#supaUrl").value || "").trim(), k = ($("#supaKey").value || "").trim(), n = $("#supaNote"); if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url)){ if (n){ n.textContent = "A URL precisa ser como https://xxxx.supabase.co"; n.className = "msg err"; } return; } if (k.length < 20 || /^sb_secret_/.test(k)){ if (n){ n.textContent = k.startsWith("sb_secret_") ? "Essa é a chave secret: nunca use no site. Copie a publishable." : "Cole a chave publishable (sb_publishable_…)."; n.className = "msg err"; } return; } try { localStorage.setItem("guia-supa", JSON.stringify({url, key: k})); localStorage.removeItem("guia-local"); } catch(err){} location.reload(); }
function readCfg(){
  const c = Object.assign({}, state.cfg);
  c.serieOn = $("#serieOn").checked; c.cursoOn = $("#cursoOn").checked;
  c.serie = ($("#serieIn").value || "Minha série").trim();
  const seasons = $("#seasonsIn").value.split(/[,;\s]+/).map(Number).filter(n => n > 0 && n < 200); c.seasons = seasons.length ? seasons : [8];
  c.epw = Number($("#epwIn").value) === 2 ? 2 : 1; c.titlesText = $("#titlesIn").value;
  c.curso = ($("#cursoIn").value || "Curso").trim(); c.aulas = Math.max(1, Number($("#aulasIn").value) || 40);
  c.barril = $("#barrilIn").value.split("\n").map(x => x.trim()).filter(Boolean);
  return c;
}

/* ---------- eventos ---------- */
document.addEventListener("click", e => {
  const tab = e.target.closest(".tab"); if (tab){ go(tab.dataset.v, true); return; }
  const a = e.target.closest('a[href="#ajustes"]'); if (a){ e.preventDefault(); go("ajustes", true); return; }
  const cal = e.target.closest("[data-cal]"); if (cal){ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + Number(cal.dataset.cal), 1); render(); return; }
  const cell = e.target.closest(".cell[data-day]"); if (cell && !cell.disabled){ sel = cell.dataset.day; render(); const p = $("#selPanel"); if (p) p.scrollIntoView({block:"start", behavior:"smooth"}); return; }
  const tb = e.target.closest("[data-test]"); if (tb){ const n = Number(tb.dataset.test); openTest = openTest === n ? null : n; render(); return; }
  const gr = e.target.closest("[data-grade]"); if (gr){ const n = Number(gr.dataset.grade), pick = quizPick["m" + n] || {}; let sc = 0; METAS[n - 1].quiz.forEach((q, i) => { if (pick[i] === q.a) sc++; }); pick.__graded = true; pick.__score = sc; quizPick["m" + n] = pick; state.tests["m" + n] = {score: sc, date: fmtLong(today()).split(", ")[1]}; persist(); render(); return; }
  const cp = e.target.closest("[data-copy]"); if (cp){ const t = document.getElementById(cp.dataset.copy).textContent; const ok = () => { cp.textContent = "Copiado"; setTimeout(() => cp.textContent = "Copiar prompt", 1800); }; if (navigator.clipboard) navigator.clipboard.writeText(t).then(ok, () => cp.textContent = "Selecione e copie"); else cp.textContent = "Selecione e copie"; return; }
  if (e.target.id === "genCopy"){ const lines = $("#gen").value.split("\n").map(l => l.trim()).filter(Boolean), bad = lines.filter(l => !l.includes("|")); if (!lines.length){ $("#genNote").textContent = "Escreva pelo menos uma linha."; return; } if (bad.length){ $("#genNote").textContent = `${bad.length} linha(s) sem o separador |.`; return; } const tsv = lines.map(l => l.split("|").map(x => x.trim()).join("\t")).join("\n"); const ok = () => $("#genNote").textContent = `${lines.length} cartão(ões) copiado(s). Cole num .txt e importe no Anki.`; if (navigator.clipboard) navigator.clipboard.writeText(tsv).then(ok, () => $("#genNote").textContent = "Não consegui copiar: selecione o texto manualmente."); return; }
  if (e.target.id === "presetST"){ $("#serieOn").checked = true; $("#serieFields").style.display = ""; $("#serieIn").value = "Stranger Things"; $("#seasonsIn").value = "8, 9, 8, 9, 8"; $("#epwIn").value = "1"; $("#titlesIn").value = ""; return; }
  if (e.target.id === "startNow"){ $("#startIn").value = key(mondayOf(today())); return; }
  if (e.target.id === "cfgSave"){ state.cfg = readCfg(); const v = $("#startIn").value; if (v) state.start = key(mondayOf(parse(v))); state.cfgSaved = true; state.cfgAt = Date.now(); Object.keys(state.days).forEach(k => { const r = state.days[k]; if (r && !r.lvl) recompute(k); }); persist(); render(); $("#cfgNote").textContent = `Pronto: ${WEEKS().length} semanas recalculadas.`; return; }
  if (e.target.id === "supaSaveCfg"){ supaSaveCfgFromForm(); return; }
  if (e.target.id === "localOnlyBtn"){ try { localStorage.setItem("guia-local", "1"); } catch(err){} render(); return; }
  if (e.target.id === "keepToggle"){ const k = !keepSession(); try { k ? localStorage.setItem("guia-keep", "1") : localStorage.removeItem("guia-keep"); } catch(err){} const n = $("#supaNote2"); if (n) n.textContent = k ? "Na próxima abertura, entra sem pedir senha." : "Na próxima abertura, pede senha de novo."; return; }
  if (e.target.id === "supaCfgLink"){ const b = $("#cfgBox"); if (b) b.classList.toggle("hidden"); return; }
  const at = e.target.closest("[data-auth]"); if (at){ authTab = at.dataset.auth; render(); return; }
  if (e.target.id === "supaForgot"){ const email = ($("#supaEmail").value || "").trim(), n = $("#supaNote"); if (!email){ n.textContent = "Digite seu e-mail para receber o link."; n.className = "msg err"; return; } sb.auth.resetPasswordForEmail(email, {redirectTo: location.href.split("#")[0]}).then(({error}) => { n.textContent = error ? "Erro: " + error.message : "Enviado: abra o e-mail neste aparelho para definir a nova senha."; n.className = error ? "msg err" : "msg"; }); return; }
  if (e.target.id === "supaNewPass"){ const a = $("#newPass").value, b = $("#newPass2").value, n = $("#supaNote"); if (a.length < 8){ n.textContent = "A senha precisa ter pelo menos 8 caracteres."; n.className = "msg err"; return; } if (a !== b){ n.textContent = "As senhas não conferem."; n.className = "msg err"; return; } sb.auth.updateUser({password: a}).then(({error}) => { if (error){ n.textContent = "Erro: " + error.message; n.className = "msg err"; return; } recovery = false; toast("Senha atualizada"); render(); }); return; }
  if (e.target.id === "supaIn" || e.target.id === "supaUp" || e.target.id === "supaMagic"){ const email = ($("#supaEmail").value || "").trim(), pass = ($("#supaPass") || {}).value || "", note = $("#supaNote"), btn = e.target; if (!email){ note.textContent = "Digite seu e-mail."; note.className = "msg err"; return; }
    (async () => { try { note.className = "msg"; note.textContent = "Aguarde…"; btn.disabled = true;
      const keep = !!($("#keepIn") && $("#keepIn").checked); try { keep ? localStorage.setItem("guia-keep", "1") : localStorage.removeItem("guia-keep"); } catch(err){}
      makeClient(supaCfg(), keep);
      if (e.target.id === "supaMagic"){ const { error } = await sb.auth.signInWithOtp({email, options:{emailRedirectTo: location.href.split("#")[0], shouldCreateUser: false}}); if (error) throw error; note.textContent = "Link enviado: abra o e-mail neste aparelho."; return; }
      if (pass.length < 8){ note.textContent = "A senha precisa ter pelo menos 8 caracteres."; note.className = "msg err"; return; }
      if (e.target.id === "supaUp"){ const { data, error } = await sb.auth.signUp({email, password: pass, options:{emailRedirectTo: location.href.split("#")[0]}}); if (error) throw error; if (data.session){ note.textContent = "Conta criada e conectada."; } else { authTab = "in"; render(); const n2 = $("#supaNote"); if (n2) n2.textContent = "Conta criada. Confirme no e-mail e depois entre aqui."; } return; }
      const { error } = await sb.auth.signInWithPassword({email, password: pass}); if (error) throw error; note.textContent = "Conectado.";
    } catch(err){ note.textContent = "Erro: " + (err.message || err); note.className = "msg err"; } finally { btn.disabled = false; } })(); return; }
  if (e.target.id === "supaOut"){ sb.auth.signOut().then(() => { clearLocalProgress(); render(); }); return; }
  if (e.target.id === "supaRefresh"){ sbLoad().then(() => { const n = $("#supaNote2"); if (n) n.textContent = "Atualizado."; }); return; }
  if (e.target.id === "resetAll"){ if (confirm("Zerar todos os dias marcados e os testes?")){ const u = Date.now(); for (const k in state.days) state.days[k] = {t:[], lvl:"none", min:0, est:0, u}; state.tests = {}; state.cando = {}; persist(); render(); } return; }
  if (e.target.id === "expBtn"){ const txt = JSON.stringify(state); $("#ioBox").value = txt; try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], {type:"application/json"})); a.download = "guia-ingles-progresso.json"; document.body.appendChild(a); a.click(); a.remove(); } catch(err){} if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => $("#ioNote").textContent = "Copiado. Se o download não abriu, cole o texto num arquivo .json.", () => $("#ioNote").textContent = "Selecione o texto da caixa e copie."); return; }
  if (e.target.id === "impBtn"){ try { const d = JSON.parse($("#ioBox").value); if (!d || typeof d !== "object") throw 0; const push = mergeRemote(d); if (d.days) for (const k in d.days) if (!state.days[k]) state.days[k] = d.days[k]; persist(); render(); $("#ioNote").textContent = "Importado: o mais recente de cada dia foi mantido."; } catch(err){ $("#ioNote").textContent = "Não consegui ler esse texto. Cole o conteúdo exportado inteiro."; } return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.matches(".task input")){ const k = t.dataset.k, i = Number(t.dataset.i), s = doneSet(k), prev = rec(k) || {}; t.checked ? s.add(i) : s.delete(i); state.days[k] = Object.assign({}, prev, {t:[...s]}); recompute(k); persist(); render(); toast((t.checked ? "Marcado: " : "Desmarcado: ") + t.getAttribute("aria-label")); return; }
  if (t.id === "nIn"){ const k = t.dataset.k; const r = rec(k) || {t:[]}; r.n = Math.max(0, Number(t.value) || 0); state.days[k] = r; recompute(k); if (!state.days[k]) state.days[k] = {t:[], lvl:"partial", min:0, est:0, n:r.n}; persist(); render(); return; }
  if (t.dataset.cando){ state.cando[t.dataset.cando] = t.checked; persist(); return; }
  if (t.dataset.q !== undefined && t.dataset.m){ const m = "m" + t.dataset.m; quizPick[m] = quizPick[m] || {}; quizPick[m][Number(t.dataset.q)] = Number(t.dataset.o); return; }
  if (t.id === "serieOn"){ $("#serieFields").style.display = t.checked ? "" : "none"; return; }
  if (t.id === "cursoOn"){ $("#cursoFields").style.display = t.checked ? "" : "none"; return; }
});
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (VIEWS.includes(v) && v !== view) go(v, false); });
(function start(){ const v = location.hash.slice(1); if (VIEWS.includes(v)) view = v; syncMode = "local"; render(); if (inClaude()) initDb(); else initSupabase(); })();

</script>
